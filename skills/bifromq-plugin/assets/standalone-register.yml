# BifroMQ standalone.yml - register ThingLinks plugins for BifroMQ 3.3.5.
#
# Build and verify four ZIPs, extract them into plugins/, register the FQNs,
# then restart BifroMQ.
#
# Required JVM option: -Dsetting_provide_init_value=true
# Without it, custom settings and PING_REQ heartbeat collection do not apply.

authProviderFQN: com.mqttsnet.thinglinks.BifromqAuthProviderPluginAuthProvider
settingProviderFQN: com.mqttsnet.thinglinks.BifromqSettingProviderPluginSettingProvider
resourceThrottlerFQN: com.mqttsnet.thinglinks.BifromqResourceThrottlerPluginResourceThrottlerProvider
# Register the event collector with the BifroMQ 3.3.5 event-collector setting.

# Runtime overrides are read from ./conf/standalone.yml. The loader does not
# treat the config.yaml carried inside each plugin ZIP as the external override.
# See references/deploy-config.md before adding plugin configuration sections.
