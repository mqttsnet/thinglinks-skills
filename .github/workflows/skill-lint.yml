name: skill-lint

# Validate skill structure on every push / PR:
# frontmatter (name + trigger description), References Index integrity
# (no dangling links, no orphan reference files), relative and bare reference
# paths, workflow `requires` tool names, and any purity rules a skill
# declares in its lint.json.

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate skills (frontmatter + References Index + purity)
        run: node scripts/validate.mjs
